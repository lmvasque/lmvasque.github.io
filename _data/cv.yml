# Experience, education and service, rendered by _pages/experience.html and
# _pages/education.html. Listed newest first; the order here is the order shown.
# `period` is display text, so write it however reads best.
# `highlights` is optional and renders as a compact bullet list.
#
# Kept in sync with the LaTeX CV. If you edit one, edit the other.

experience:
  - role: "Full Stack AI Engineer"
    org: "Doodle AG"
    url: "https://doodle.com"
    location: "Zurich, Switzerland"
    period: "2026 – present"
    highlights:
      - "Designed and evaluated 20+ event-importance features across three scheduling products, including an event-topic classifier using multilingual sentence embeddings in Python and SQL."
      - "Built a two-stage multilingual event-topic pipeline: derived a topic taxonomy from historical data using BERTopic, assigned events to it using sentence embeddings, and validated outputs through structured manual review."
      - "Engineered 6 dbt models on Amazon Redshift to compute meeting- and attendee-level features at a production data-warehouse scale, with comparative feature analysis on representative samples."
      - "Implemented end-to-end Apache Airflow DAGs connecting the data models to the event classification step."

  - role: "Postdoctoral Researcher"
    org: "Idiap Research Institute"
    url: "https://www.idiap.ch/en"
    location: "Martigny, Switzerland"
    period: "2023 – 2025"
    highlights:
      - "Led the SEM24 Innosuisse project, transforming business requirements into deployed NLP systems for skill extraction from job offers and resumes through effective academia-industry collaboration."
      - "Delivered three multilingual, explainable skill-extraction systems for HR recommendation: rule-based, semantic search, and a fine-tuned BERT model applying Named Entity Recognition (NER), text classification, and prompt engineering in PyTorch and Hugging Face, with the BERT system adopted by the industry partner."
      - "Published research findings across 5 peer-reviewed papers (RecSys 2024, HICSS 2025, SwissText 2025–2026, Data & Policy 2026) and delivered technical talks at international NLP conferences."
      # Cut from the CV for space; kept here, where there is room for it.
      - "Supervised a three-month internship applying NLP to social media data to analyse public perspectives on climate change."

  - role: "PhD Researcher"
    org: "National Centre for Text Mining (NaCTeM), University of Manchester"
    url: "http://nactem.ac.uk/"
    location: "Manchester, United Kingdom"
    period: "2020 – 2023"
    highlights:
      - "Conducted research on document-level text simplification, including statistical analysis, generative AI models, and evaluation metrics design, resulting in 3 publications (ACL 2021, SEPLN 2021, RANLP 2023)."
      - "Developed methods and benchmarks for lexical and sentence simplification using LLM prompt engineering, publishing 2 papers (EMNLP 2022, EMNLP 2023)."
      - "Implemented multilingual methods for readability research, resulting in a publication (EMNLP 2022)."

  - role: "Software Engineer"
    org: "Intel Corporation"
    url: "https://www.intel.com/content/www/us/en/corporate-responsibility/intel-in-costa-rica.html"
